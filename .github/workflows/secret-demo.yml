name: workflow_dispatch
on:
  push:
    pull_request:
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - if: ${{secret.DEMO_TOKEN = ''}}
        run: exit 1
      - run: echo ${#DEMO_TOKEN}
      - run: echo ${DEMO_TOKEN}
      - run: echo ${{ vars.APP_ENV }}