name: Secret demo
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - if: ${{ env.DEMO_TOKEN == '' }}
        run: exit 1
      - run: echo ${#DEMO_TOKEN}
      - run: echo ${DEMO_TOKEN}
      - run: echo ${{ vars.APP_ENV }}