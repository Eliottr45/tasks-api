name: Secret-demo.yml
on:
  push:
    pullrequest:
jobs:
  workflow_dispatch:
    runs-on: ubuntun-latest
    steps:
      - uses: actions/checkout@v6
      - if: ${{secrets.DEMO_TOKEN == ''}}
        run: exit 1
      - run: echo ${{secrets.DEMO_TOKEN}}
      - run: echo ${#DEMO_TOKEN}
      - run: echo ${DEMO_TOKEN}
      - run: echo ${{ vars.APP_ENV }}